[project]
name = "worldcrafter-runtime"
version = "0.1.0"
description = "Reproducible inference environment for WorldCrafter"
requires-python = ">=3.11,<3.12"
dependencies = [
    "worldcrafter[xformers]",
    "torch==2.10.0+cu128",
    "torchvision==0.25.0+cu128",
    "flash-attn-3==3.0.0",
]

[project.optional-dependencies]
demo = ["worldcrafter[demo]"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
worldcrafter = { path = "..", editable = true }
